name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Core tests
        run: swift test && swift test -c release
      - name: Mac Release build
        run: xcodebuild -project 'Studio Notebook.xcodeproj' -scheme 'Studio Notebook' -configuration Release -destination 'platform=macOS' -derivedDataPath build/Mac build
      - name: iPad device Release build
        run: xcodebuild -project 'Studio Notebook.xcodeproj' -scheme 'Studio Notebook' -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/iPad CODE_SIGNING_ALLOWED=NO build
      - name: Ensure iPad runtime
        run: |
          xcrun simctl list runtimes --json > /tmp/runtimes.json
          if ! python3 -c 'import json; raise SystemExit(not any(x.get("isAvailable") and "iOS-27" in x["identifier"] for x in json.load(open("/tmp/runtimes.json"))["runtimes"]))'; then
            xcodebuild -downloadPlatform iOS -buildVersion 27.0 -architectureVariant arm64
          fi
      - name: Native notebook workflow
        run: bash Scripts/test-ui.sh
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-workflow
          path: |
            build/Screenshots
            build/Workflow-*.xcresult
          if-no-files-found: ignore
